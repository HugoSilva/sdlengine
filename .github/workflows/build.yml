name: build

on:
  push:
    branches: [ dev, master, feature/** ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [ x64-debug, x64-release ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
        # The vendored GoogleTest is Win32/Debug only, so the x64 presets build
        # the UnitTests target but register no tests yet. Keep this non-fatal
        # until googletest is vendored for x64.
        continue-on-error: true
