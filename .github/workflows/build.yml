name: build

on:
  push:
    branches: [ dev, master, feature/** ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [ x64-debug, x64-release ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The presets drive Ninja with cl.exe, so the MSVC environment has to be
      # on PATH before configuring (the hosted runner does not set it up).
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
