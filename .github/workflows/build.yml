name: build

on:
  push:
    branches: [ dev, master, feature/** ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [ x64-debug, x64-release ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The presets drive Ninja with cl.exe, so the MSVC environment has to be
      # on PATH before configuring (the hosted runner does not set it up).
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # The style gate. Formatting is complete-or-nothing and cheap, so CI checks
  # every file; it runs as its own job so a failure is legible on its own and
  # does not hold up the build matrix. Naming is not checked here: clang-tidy
  # needs a full build, and the pre-push hook checks the files a push actually
  # changes instead (see docs/CodingStandards.md §6).
  format:
    name: format
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # clang-format output changes between major versions, so this one is pinned
      # to the release line the tree was formatted with. A drifted version would
      # report every file as unformatted at once.
      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "19.1"

      # tools\_llvm.bat finds clang-format through PATH, which the action sets.
      - name: Check formatting
        run: tools\check-format.bat
